spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          searchLocations:
            - classpath:config/core/category-service/
            - classpath:config/core/comment-service/
            - classpath:config/core/request-service/
            - classpath:config/core/event-service/
            - classpath:config/core/user-service/
            - classpath:config/stats-server/
            - classpath:config/gateway-server/
        fail-fast: true
        retry:
          useRandomPolicy: true
          max-interval: 6000
server:
  port: 0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/