spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          searchLocations:
            - classpath:config/core/category-service/
            - classpath:config/core/comment-service/
            - classpath:config/core/request-service/
            - classpath:config/core/event-service/
            - classpath:config/core/user-service/
            - classpath:config/gateway-server/
            - classpath:/config/stats/{application}
        fail-fast: true
        retry:
          useRandomPolicy: true
          max-interval: 6000
server:
  port: 0

eureka:
  instance:
    preferIpAddress: false
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/